services:
  - type: web
    name: memory-maker-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: memory_maker
      - key: RESEND_API_KEY
        sync: false
      - key: FAL_KEY
        sync: false
      - key: OTP_FROM_EMAIL
        value: "Memory Maker <onboarding@resend.dev>"
